name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays: live checks against ChEMBL, SureChEMBL and HGNC
  workflow_dispatch:

jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Offline tests
        run: uv run pytest -v --cov=pemt --cov-report=term-missing

  live:
    # Catches upstream changes (APIs, bulk data schema, download URLs) early.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Live tests
        run: uv run pytest -v -m live
