exclude: '^(data/|example/.*\.(xml|tsv)$|tests/resources/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
