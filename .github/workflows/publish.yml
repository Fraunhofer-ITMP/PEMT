name: publish

# Publishes to PyPI when a GitHub release is published (e.g. tag v0.1.0), and to
# TestPyPI when a tag starting with "testpypi-" is pushed (works from any branch).
# Uses trusted publishing: no API token is stored in the repository.
on:
  release:
    types: [published]
  push:
    tags: ["testpypi-*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Offline tests
        run: uv sync --locked && uv run pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check the wheel installs and runs
        run: uvx --from dist/*.whl pemt --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || github.event_name == 'push' && 'testpypi' || inputs.target }}
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # TestPyPI never accepts the same version twice
      - name: Publish to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
